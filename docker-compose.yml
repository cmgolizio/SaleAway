services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: saleaway
      POSTGRES_USER: saleaway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saleaway -d saleaway"]
      interval: 5s
      retries: 20
    # No published ports: only the app container can reach the database.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://saleaway:${POSTGRES_PASSWORD}@db:5432/saleaway
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_EMAIL_DOMAIN: ${ADMIN_EMAIL_DOMAIN:-artisanfinewines.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"

volumes:
  pgdata:
